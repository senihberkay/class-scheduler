services:
  # Backend Service
  - type: web
    name: ozuchedule-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      cd v2/backend
      pip install -r requirements.txt
    startCommand: |
      cd v2/backend
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
